<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMM - Sistema de Gestion de Viajes</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0D1B2E;--blue:#003C78;--blue-mid:#1A5A9E;--gold:#C8A440;
--surface:#FFFFFF;--bg:#F5F4F0;--border:#D8D6CF;--text:#1A1916;
--muted:#6B6860;--light:#9B9890;--danger:#8B2020;--danger-bg:#FEE;
--sans:'IBM Plex Sans',sans-serif;--r:4px}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--navy);color:var(--text)}
#login-screen{position:fixed;inset:0;background:#0D1B2E;display:flex;
align-items:center;justify-content:center;z-index:9999}
.login-card{background:var(--surface);border-radius:12px;
box-shadow:0 8px 60px rgba(0,0,0,0.5);width:100%;max-width:380px;overflow:hidden}
.login-header{background:var(--navy);padding:32px 28px 24px;text-align:center}
.login-header img{max-width:80%;height:140px;object-fit:contain}
.login-body{padding:28px}
.login-title{font-size:17px;font-weight:600;color:var(--blue);margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.lf{margin-bottom:14px}
.lf label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
color:var(--muted);display:block;margin-bottom:5px}
.lf input{width:100%;padding:10px 12px;border:1px solid var(--border);
border-radius:var(--r);font-family:var(--sans);font-size:14px;background:var(--bg)}
.lf input:focus{outline:none;border-color:var(--blue);background:white;
box-shadow:0 0 0 3px rgba(0,60,120,.1)}
.login-btn{width:100%;padding:12px;background:var(--blue);color:white;border:none;
border-radius:var(--r);font-family:var(--sans);font-size:15px;font-weight:600;
cursor:pointer;margin-top:4px}
.login-btn:hover{background:var(--blue-mid)}
.login-error{background:var(--danger-bg);color:var(--danger);border:1px solid #FFBBBB;
border-radius:var(--r);padding:9px 12px;font-size:13px;margin-top:12px;
display:none;text-align:center}
.login-footer{text-align:center;font-size:11px;color:var(--light);
padding:12px;border-top:1px solid #f0f0f0}
#app{display:none;height:100vh;flex-direction:column}
#app.visible{display:flex}
#topbar{background:var(--navy);border-bottom:1px solid rgba(255,255,255,.08);
display:flex;align-items:center;padding:0 20px;height:56px;flex-shrink:0;gap:8px}
.brand{margin-right:auto}
.brand-name{color:white;font-size:13px;font-weight:600;letter-spacing:.04em}
.brand-sub{color:rgba(255,255,255,.45);font-size:10px;letter-spacing:.08em;
text-transform:uppercase}
.nav-tab{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);
cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;
color:rgba(255,255,255,.55);border:1px solid transparent;transition:all .2s;
white-space:nowrap;background:none;font-family:var(--sans)}
.nav-tab:hover{color:white;background:rgba(255,255,255,.07)}
.nav-tab.active{background:rgba(255,255,255,.12);color:white;
border-color:rgba(255,255,255,.2)}
.tab-icon{font-size:14px}
#content{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.module-frame{position:absolute;inset:0;width:100%;height:100%;border:none;display:none}
.module-frame.active{display:block}
@media(max-width:700px){.brand-sub,.tab-label{display:none}
.nav-tab{padding:8px 10px}#topbar{padding:0 12px;gap:4px}}
</style>
</head>

var CRED = { admin: "MMM2026" };
var loaded = { aprobacion:false, itinerario:false, sistema:false, hoteles:false, vuelos:false };

function b64ToUtf8(str){
  var bin = atob(str);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function loadModule(name){
  if(loaded[name]) return;
  var frame = document.getElementById("frame-"+name);
  try{
    var html = b64ToUtf8(MODULE_B64[name]);
    frame.setAttribute("srcdoc", html);
    loaded[name] = true;
  }catch(e){
    alert("Error al cargar modulo "+name+": "+e.message);
  }
}

function showModule(name){
  var tabs = document.querySelectorAll(".nav-tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle("active", tabs[i].getAttribute("data-mod")===name);
  }
  var mods = ["aprobacion","itinerario","sistema","hoteles","vuelos"];
  for(var j=0;j<mods.length;j++){
    document.getElementById("frame-"+mods[j]).classList.toggle("active", mods[j]===name);
  }
  loadModule(name);
}

function doLogin(){
  var u = document.getElementById("lu").value.trim();
  var p = document.getElementById("lp").value;
  var err = document.getElementById("lerr");
  if(CRED[u] && CRED[u]===p){
    document.getElementById("login-screen").style.display="none";
    document.getElementById("app").classList.add("visible");
    err.style.display="none";
    loadModule("aprobacion");
  }else{
    err.style.display="block";
    document.getElementById("lp").value="";
    document.getElementById("lp").focus();
  }
}

window.addEventListener("DOMContentLoaded", function(){
  document.getElementById("login-go").addEventListener("click", doLogin);
  document.getElementById("lp").addEventListener("keydown", function(e){
    if(e.key==="Enter") doLogin();
  });
  document.getElementById("lu").addEventListener("keydown", function(e){
    if(e.key==="Enter") document.getElementById("lp").focus();
  });
  document.getElementById("lu").focus();
  var tabs = document.querySelectorAll(".nav-tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener("click", function(){
      showModule(this.getAttribute("data-mod"));
    });
  }
});
</script>
